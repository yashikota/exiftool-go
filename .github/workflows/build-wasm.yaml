name: Build WASM

on:
  workflow_dispatch:
    inputs:
      perl_version:
        description: "Perl version"
        default: "5.42.0"
      exiftool_version:
        description: "ExifTool version"
        default: "13.59"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build exiftool.wasm
        run: |
          docker build \
            --build-arg PERL_VERSION=${{ inputs.perl_version }} \
            --build-arg EXIFTOOL_VERSION=${{ inputs.exiftool_version }} \
            -t exiftool-wasm-builder \
            ./build

      - name: Extract artifact
        run: |
          mkdir -p output
          docker run --rm -v "$(pwd)/output:/output" exiftool-wasm-builder

      - name: Upload exiftool.wasm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exiftool.wasm
          path: output/exiftool.wasm
