name: Build WASM

on:
  workflow_dispatch:
    inputs:
      perl_version:
        description: "Perl version"
        default: "5.42.0"
      exiftool_version:
        description: "ExifTool version"
        default: "13.59"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build exiftool.wasm
        run: |
          docker build \
            --build-arg PERL_VERSION=${{ inputs.perl_version }} \
            --build-arg EXIFTOOL_VERSION=${{ inputs.exiftool_version }} \
            -t exiftool-wasm-builder \
            ./build

      - name: Extract artifact
        run: |
          mkdir -p output
          docker run --rm -v "$(pwd)/output:/output" exiftool-wasm-builder

      - name: Upload exiftool.wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exiftool.wasm
          path: output/exiftool.wasm
