name: Build WASM

on:
  workflow_dispatch:
    inputs:
      perl_version:
        description: "Perl version"
        default: "5.42.0"
      exiftool_version:
        description: "ExifTool version"
        default: "13.59"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build exiftool.wasm
        run: |
          docker build \
            --build-arg PERL_VERSION=${{ inputs.perl_version }} \
            --build-arg EXIFTOOL_VERSION=${{ inputs.exiftool_version }} \
            -t exiftool-wasm-builder \
            ./build

      - name: Extract artifact
        run: |
          mkdir -p output
          docker run --rm -v "$(pwd)/output:/output" exiftool-wasm-builder

      - name: Upload exiftool.wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exiftool.wasm
          path: output/exiftool.wasm
